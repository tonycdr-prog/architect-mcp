name: Publish npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: npm ci
      - name: Release gate
        run: npm run release:check
      - name: Pack
        run: npm pack --json > pack.json
      - name: Tarball install smoke
        run: |
          tarball="$(node -e 'const fs = require("node:fs"); const packed = JSON.parse(fs.readFileSync("pack.json", "utf8")); console.log(packed[0].filename);')"
          smoke_dir="$(mktemp -d)"
          npm init -y --prefix "$smoke_dir"
          npm install --prefix "$smoke_dir" "$PWD/$tarball"
          cd "$smoke_dir"
          node --input-type=module <<'NODE'
          import { strict as assert } from "node:assert";
          import { createArchitectServer } from "@tonycdr-prog/architect-mcp/server";
          const server = createArchitectServer({ toolSurface: "core", enableLocalWorkspaceTool: false });
          assert.equal(typeof server.connect, "function");
          await server.close();
          NODE
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
