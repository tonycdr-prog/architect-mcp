name: Governance audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Build source TUI
        run: npm run build && cargo build --workspace --bin architect-mcp-tui
      - name: Run governance audit
        id: governance_audit
        continue-on-error: true
        run: node bin/architect-mcp-tui.cjs governance-audit --public-summary > governance-audit-public-summary.json
      - name: Summarize public-safe evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          let report = null;
          try {
            report = JSON.parse(fs.readFileSync("governance-audit-public-summary.json", "utf8"));
          } catch {
            const summary = [
              "# Governance audit",
              "",
              "Status: failed",
              "Read only: unknown",
              "MCP gate: unknown",
              "Files reviewed: unknown",
              "Scan truncated: unknown",
              "",
              "The governance audit command failed before a public-safe summary could be parsed.",
              "Do not copy raw local paths, secrets, private repo names, raw file contents, or raw audit JSON into public issues."
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
            process.exit(0);
          }
          const categories = report.categories
            .filter((category) => category.summary !== "no findings")
            .map((category) => `- ${category.name}: ${category.status} (${category.summary})`)
            .join("\n") || "- none";
          const deterministic = report.deterministicGates.names
            .map((name) => `- ${name}`)
            .join("\n");
          const smoke = report.smokeEvidence.names
            .map((name) => `- ${name}`)
            .join("\n");
          const mcp = report.mcpReview || {};
          const summary = [
            "# Governance audit",
            "",
            `Status: ${report.status}`,
            `Read only: ${report.readOnly}`,
            `MCP gate: ${mcp.gateStatus || "unknown"}`,
            `Files reviewed: ${mcp.filesReviewed ?? "unknown"}`,
            `Scan truncated: ${mcp.scanTruncated ?? "unknown"}`,
            `Finding errors: ${report.findingCounts.errors}`,
            `Finding warnings: ${report.findingCounts.warnings}`,
            `MCP errors: ${mcp.errors ?? "unknown"}`,
            `MCP warnings: ${mcp.warnings ?? "unknown"}`,
            `Memory proposals: ${report.memory.proposalCount} (${report.memory.safeToStoreCount} safe)`,
            "",
            "## Categories With Findings",
            categories,
            "",
            "## Deterministic Gates",
            deterministic,
            "",
            "## Smoke Evidence",
            smoke,
            "",
            "Do not copy raw local paths, secrets, private repo names, raw file contents, or raw audit JSON into public issues."
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
      - name: Fail if governance audit failed
        if: steps.governance_audit.outcome == 'failure'
        run: exit 1
