name: TUI install smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Build TUI release binary
        run: npm run tui:build
      - name: Smoke npm shim help
        run: node bin/architect-mcp-tui.cjs --help
      - name: Run npm shim tests
        run: node --import tsx --test tests/tuiShim.test.ts
