name: TUI install smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Build TUI release binary
        run: npm run tui:build
      - name: Smoke npm shim help
        run: node bin/architect-mcp-tui.cjs --help
      - name: Run npm shim tests
        run: node --import tsx --test tests/tuiShim.test.ts
