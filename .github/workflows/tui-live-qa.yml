name: TUI live QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/architect-tui/**"
      - "bin/architect-mcp-tui.cjs"
      - ".github/workflows/tui-live-qa.yml"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  live-qa:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Run TUI live QA smoke
        run: npm run tui:live-qa
