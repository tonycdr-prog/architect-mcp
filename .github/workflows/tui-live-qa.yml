name: TUI live QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/architect-tui/**"
      - "bin/architect-mcp-tui.cjs"
      - ".github/workflows/tui-live-qa.yml"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  live-qa:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Run TUI live QA smoke
        run: npm run tui:live-qa
      - name: Generate public terminal evidence summary
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          node bin/architect-mcp-tui.cjs terminal-evidence --json \
            --source "GitHub Actions TUI live QA ${RUNNER_OS} run ${GITHUB_RUN_ID}" \
            --notes "CI hosted runner evidence only; manual issue #136 terminal QA still required" \
            > terminal-evidence.json
          node - <<'NODE'
          const fs = require("node:fs");
          const evidence = fs.readFileSync("terminal-evidence.json", "utf8").trim();
          const os = process.env.RUNNER_OS || "unknown";
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Public terminal evidence (${os})\n\nHosted CI evidence is a baseline only; manual issue #136 terminal QA is still required.\n\n\`\`\`json\n${evidence}\n\`\`\`\n`
          );
          NODE
