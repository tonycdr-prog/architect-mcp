name: Terminal QA report
description: Report a real terminal smoke result for architect-mcp-tui.
title: "[terminal-qa]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing in a real terminal. On Linux and Windows, run `architect-mcp-tui terminal-evidence --json` and paste that public-safe summary below. Do not include secrets, tokens, private repository names, absolute local paths, raw stdout/stderr logs, or private file contents. Summarize command results instead of pasting raw `architect-mcp-tui smoke --json` output.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows PowerShell
        - Windows Git Bash
        - Windows Terminal
        - Linux terminal
        - macOS terminal
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS and CPU
      description: Example: Windows 11 x64, Ubuntu 24.04 arm64, Fedora 41 x64.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: architect-mcp package version
      description: Paste the npm package version or release tag you tested.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Paste the commands you ran. Redact paths if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: launch-judge-evidence
    attributes:
      label: Launch judge terminal evidence JSON
      description: Required for Linux and Windows launch-readiness reports. Paste the public-safe output from architect-mcp-tui terminal-evidence --json, or a maintainer-normalized equivalent that can be saved as terminal-evidence.json and passed to architect-mcp-tui launch-judge --terminal-evidence. Do not paste raw smoke JSON.
      render: json
      value: |
        {
          "schemaVersion": 1,
          "reports": [
            {
              "platform": "linux",
              "status": "passed",
              "source": "issue #136 public-safe terminal QA report",
              "commandSummary": "architect-mcp-tui terminal-evidence --json passed; help, adapter summary, and gate-only run were summarized",
              "notes": "summary only, no raw logs"
            }
          ]
        }
    validations:
      required: false
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Passed
        - Passed with warnings
        - Failed
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Rendering issues, mouse behavior, resize behavior, unclear docs, install oddities, or anything brittle.
    validations:
      required: false
