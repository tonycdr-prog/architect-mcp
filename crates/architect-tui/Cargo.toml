[package]
name = "architect-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ratatui terminal client and agent orchestrator for architect-mcp."

[[bin]]
name = "architect-mcp-tui"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.11.1"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream", "serde"] }
directories = "6.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"

